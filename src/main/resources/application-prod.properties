# Activate with: SPRING_PROFILES_ACTIVE=prod
# All secrets below MUST be supplied as real environment variables in production —
# the ${VAR_NAME} syntax with no fallback means startup fails loudly if one is missing,
# rather than silently falling back to a dev/placeholder value.

# --- Database connection (no fallback defaults — force real values) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.show-sql=false

# --- Flyway ---
# Never allow flyway:clean in prod — this would wipe the schema.
spring.flyway.clean-disabled=true

# --- JWT secret (no fallback — must be set via env/secrets manager) ---
app.jwt.secret=${JWT_SECRET}

# --- CORS: no fallback ? force an explicit real frontend domain in prod
# rather than silently allowing the dev localhost origin (or nothing) through. ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Swagger/OpenAPI: disable public docs UI in production ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Logging: quieter, no SQL/bind-parameter tracing ---
logging.level.org.springframework.security=WARN
logging.level.com.pharmacy.backend=INFO
logging.level.org.hibernate.SQL=WARN

# --- Error responses: don't leak stack traces / internals to clients ---
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
