spring.application.name=pharmacy

#Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# --- App-specific settings (custom, read via @ConfigurationProperties) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET}

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgresSQLDialect

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.enabled=true
spring.flyway.username=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
baseline-description=true

# --- CORS: which frontend origin(s) may call this API from a browser ---
# Overridden per-profile (see application-dev.properties / application-prod.properties).
# Comma-separated if more than one origin is ever needed.
app.cors.allowed-origins=http://localhost:8081

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.pharmacy.backend=DEBUG
