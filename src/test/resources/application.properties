# Test-scope configuration.
#
# src/main/resources/application.properties resolves DB_URL / DB_USERNAME /
# DB_PASSWORD / JWT_SECRET from the environment with no fallback, so the
# build could not run tests without a live Postgres and a real secret on the
# machine. This file shadows it on the test classpath so `mvn test` is
# self-contained on any checkout.
#
# Flyway is off and Hibernate creates the schema instead: the migrations in
# db/migration are PostgreSQL-specific (uuid-ossp, CHECK constraints) and are
# not the thing under test here. Anything that genuinely needs to exercise
# those migrations belongs in a Testcontainers-backed integration test — see
# the QA report's recommendations.

spring.application.name=pharmacy-test

spring.datasource.url=jdbc:h2:mem:pharmacy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-hs256
app.jwt.expiration-ms=3600000
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-hs256

app.cors.allowed-origins=http://localhost:8081

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
